# SPDX-License-Identifier: MIT
# Offline-only port scaffold. lk2nd reads extlinux from a nested disk image
# inside system; it is not an Android slot-B install. Generic image/flash/
# push/install commands deliberately reject this BOOT_METHOD.
CODENAME=thinksmart
NAME="Lenovo ThinkSmart View CD-18781Y"
SOC=apq8053
COMPATIBLE="lenovo,cd-18781y"
PACKAGE=omamobile-device-thinksmart
ROOTFS_PACKAGES=""
# Shared Mesa includes Freedreno. PanVK is a Mali driver and is not needed.
ROOTFS_OMAMOBILE_SKIP="vulkan-panfrost"
BOOT_METHOD=lk2nd
BOOT_IMAGES=""
UFS_RW=""
DTB=qcom/apq8053-lenovo-cd-18781y.dtb
PANEL_SIZE=800x1280
